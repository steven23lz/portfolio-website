<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var stored = localStorage.getItem("color-scheme") || "light";
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var resolved =
          stored === "dark" || (stored === "light dark" && prefersDark)
            ? "dark"
            : "light";
        document.querySelector('meta[name="color-scheme"]').content = stored;
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.dataset.theme = resolved;
      } catch (e) {}
    </script>
    <title>Steven Sendrijas — Full-Stack, Game &amp; AI Bot Developer</title>
    <meta
      name="description"
      content="Portfolio of Steven Floyd Sendrijas — BSIT Student at STI College CDO & Full-Stack Web, Unity 2D Game, and Discord AI Bot Developer."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0a'/><text x='50%' y='63%' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='700' font-size='34' fill='%23ffffff'>SFS</text></svg>"
    />
    <!-- Geist + Geist Mono + Source Serif 4 (Google Fonts) -->

      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@300..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&display=swap"

    <!-- Font Awesome 6.5.0 -->

    />
  </head>
