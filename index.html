<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        document.querySelector('meta[name="color-scheme"]').content =
          localStorage.getItem("color-scheme") ?? "light";
      } catch (e) {}
    </script>
    <title>Steven Floyd Sendrijas — IT Student &amp; Full-Stack Developer</title>
    <meta
      name="description"

    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50%' y='64%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='38' fill='%23ffffff'>&lt;SFS/&gt;</text></svg>"
    />

    />
